[project]
name = "elice-board-api"
version = "0.1.0"
description = "Elice mini project - board service API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "anyio>=4.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic 이 생성하는 파일이라 손대지 않는다 (재생성 시 되돌아감).
"migrations/versions/*" = ["E501", "UP035", "UP007", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 엔진·Redis 클라이언트가 세션 스코프라 테스트와 같은 이벤트 루프를 써야 한다.
# 기본값(function)이면 커넥션이 닫힌 루프에 묶여 "Event loop is closed" 가 난다.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
